[package]
name = "libopus_sys"
version = "0.3.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/cijiugechu/libopus_sys.git"
authors = ["nemurubaka <cijiugechu@gmail.com>"]
description = "AscendCord's pinned, static libopus binding"
include = ["build.rs", "Cargo.toml", "README.md", "LICENSE", "LICENSE-old", "CHANGELOG.md", "src/**", "opus/**"]
build = "build.rs"

[dependencies]

[build-dependencies]
log = "0.4"
pkg-config = "0.3"
cmake = "0.1"
bindgen = { version = "0.70", optional = true }

[features]
default = []
dynamic = []
static = []
bundled = []
generate_binding = ["bindgen"]
