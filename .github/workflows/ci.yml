name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (fmt, clippy, tests)
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Version and help exit without opening a window
        shell: pwsh
        run: |
          cargo build -p ascendcord --locked
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $exe = "$PWD\target\debug\ascendcord.exe"
          function Invoke-Flag($flag) {
            $job = Start-Job {
              $out = & $using:exe $using:flag | Out-String
              if ($LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }
              $out
            }
            if (-not (Wait-Job $job -Timeout 30)) { throw "ascendcord $flag did not exit" }
            (Receive-Job $job -ErrorAction Stop).Trim()
          }
          $out = Invoke-Flag --version
          if ($out -ne "AscendCord $version") { throw "unexpected --version output: '$out'" }
          $help = Invoke-Flag --help
          if ($help -notmatch 'Usage: ascendcord' -or $help -notmatch '--version') {
            throw "unexpected --help output: '$help'"
          }
          # Redirected by cmd itself: the file handle must be used, not replaced.
          cmd /d /c "target\debug\ascendcord.exe --version > version.txt"
          if ($LASTEXITCODE -ne 0) { throw "redirected --version exit code $LASTEXITCODE" }
          $file = (Get-Content -Raw version.txt).Trim()
          if ($file -ne "AscendCord $version") { throw "unexpected redirected output: '$file'" }
