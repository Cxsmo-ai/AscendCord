name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (fmt, clippy, tests)
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Version flag exits without opening a window
        shell: pwsh
        run: |
          cargo build -p ascendcord --locked
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $job = Start-Job { & "$using:PWD\target\debug\ascendcord.exe" --version | Out-String }
          if (-not (Wait-Job $job -Timeout 30)) { throw "ascendcord --version did not exit" }
          $out = (Receive-Job $job).Trim()
          if ($out -ne "AscendCord $version") { throw "unexpected output: '$out'" }
