name: Test build

# Manual Windows build of any branch for trying a change on real hardware. Uses thin LTO, so
# it is quicker than a release build; the binary is kept as a short-lived artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-build

      - name: Build
        run: cargo build --release -p ascendcord --locked

      - name: Media probe on the runner
        shell: pwsh
        run: |
          $job = Start-Job { & "$using:PWD\target\release\ascendcord.exe" --media-probe | Out-String }
          if (-not (Wait-Job $job -Timeout 120)) { throw "media probe did not finish" }
          Receive-Job $job

      - uses: actions/upload-artifact@v4
        with:
          name: ascendcord-windows-test
          path: target/release/ascendcord.exe
          retention-days: 3
