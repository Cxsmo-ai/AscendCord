name: Test build

# Manual Windows build of any branch for trying a change on real hardware. Uses thin LTO, so
# it is quicker than a release build; the binary is kept as a short-lived artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-build

      - name: Build
        run: cargo build --release -p ascendcord --locked

      # The runner has no cameras; this shows the screen path and that the probe exits.
      - name: Media probe on the runner
        continue-on-error: true
        shell: pwsh
        run: |
          $probe = Start-Process -FilePath target\release\ascendcord.exe -ArgumentList '--media-probe' `
            -RedirectStandardOutput probe.txt -RedirectStandardError probe-err.txt -PassThru
          if (-not $probe.WaitForExit(120000)) { $probe.Kill(); Write-Output 'probe did not finish' }
          Get-Content probe.txt, probe-err.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ascendcord-windows-test
          path: target/release/ascendcord.exe
          retention-days: 3
