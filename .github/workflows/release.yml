name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  arch:
    name: Arch Linux package
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container: archlinux:base-devel
    steps:
      - name: Prepare the build user
        run: |
          pacman -Syu --noconfirm --needed git
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - uses: actions/checkout@v4

      - name: PKGBUILD for the tagged source archive
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          mkdir -p /home/builder/pkg
          curl -fsSL -o /tmp/source.tar.gz \
            "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$tag.tar.gz"
          sum=$(sha256sum /tmp/source.tar.gz | cut -d' ' -f1)
          sed -e "s/^pkgver=.*/pkgver=$version/" \
              -e "s/^sha256sums=.*/sha256sums=('$sum')/" \
              packaging/aur/PKGBUILD > /home/builder/pkg/PKGBUILD
          if grep -q "'SKIP'" /home/builder/pkg/PKGBUILD; then exit 1; fi
          chown -R builder:builder /home/builder/pkg

      - name: Build, install and check the package
        run: |
          cd /home/builder/pkg
          sudo -u builder makepkg --syncdeps --noconfirm --cleanbuild
          pacman -U --noconfirm ascendcord-*.pkg.tar.zst
          if ldd /usr/bin/ascendcord | grep 'not found'; then exit 1; fi
          mkdir -p "$GITHUB_WORKSPACE/arch-out"
          cp ascendcord-*.pkg.tar.zst PKGBUILD "$GITHUB_WORKSPACE/arch-out/"

      - uses: actions/upload-artifact@v4
        with:
          name: arch-release
          path: arch-out/*
          if-no-files-found: error

  windows:
    name: Windows release
    needs: arch
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      # Builds published here update themselves from this repository's releases.
      ASCENDCORD_RELEASE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the crate version
        shell: pwsh
        run: ./scripts/release/check-version.ps1 -Tag "${{ github.ref_name }}"

      - uses: Swatinem/rust-cache@v2

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis -y --no-progress
          }

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build and package
        run: cargo xtask package

      - uses: actions/download-artifact@v4
        with:
          name: arch-release
          path: arch-out

      - name: Collect release assets
        shell: pwsh
        run: ./scripts/release/assemble-windows.ps1 -Tag "${{ github.ref_name }}"

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "docs/releases/$tag.md"
          $arguments = @('release', 'create', $tag, '--draft', '--verify-tag', '--title', "AscendCord $tag")
          if (Test-Path $notes) { $arguments += @('--notes-file', $notes) } else { $arguments += '--generate-notes' }
          if ($tag -match '-') { $arguments += '--prerelease' }
          $assets = Get-ChildItem release-assets -File | ForEach-Object FullName
          gh @arguments @assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Every asset is attached before the release becomes visible.
          gh release edit $tag --draft=false
